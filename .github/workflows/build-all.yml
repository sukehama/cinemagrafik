name: Build Desktop & Mobile Apps

on:
  push:
    branches: [ main ] # Change to master if your default branch is master

jobs:
  # 1. BUILD DESKTOP INSTALLERS (Windows, Mac, Linux)
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App (Desktop)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0-${{ github.run_number }}
          releaseName: 'Automated Release v1.0.0-${{ github.run_number }}'
          releaseDraft: true
          prerelease: false

  # 2. BUILD ANDROID APK
  build-android:
    needs: build-desktop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Android APK
        run: npx tauri android build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_x64 }}
          GRADLE_OPTS: "-Dorg.gradle.java.home=${{ env.JAVA_HOME_21_x64 }}"

      - name: Attach APK to Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v1.0.0-${{ github.run_number }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
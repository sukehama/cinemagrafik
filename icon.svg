<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Tamna zaobljena pozadina usklađena sa Windows i CinemaGrafik temom -->
  <rect width="512" height="512" rx="110" fill="#09090b"/>
  
  <!-- Suptilni kružni sjaj u pozadini -->
  <circle cx="256" cy="256" r="200" fill="#f97316" opacity="0.08"/>
  
  <!-- Minimalistički tekst "CG" -->
  <text x="256" y="325" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="230" 
        font-weight="900" 
        letter-spacing="-10"
        text-anchor="middle">
    <tspan fill="#f97316">C</tspan><tspan fill="#ffffff">G</tspan>
  </text>
</svg>
